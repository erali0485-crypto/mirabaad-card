*{box-sizing:border-box}html,body{margin:0;padding:0;background:#dcecf8;font-family:Arial,Helvetica,sans-serif;color:var(--blue)}
body{min-width:320px}.page{width:min(100%,1120px);margin:0 auto;background:#fff;box-shadow:0 18px 70px #062f6826;overflow:hidden}
.hero{position:relative;min-height:540px;padding:44px 56px 50px;background:linear-gradient(135deg,#fff 0%,#fff 66%,#edf7ff 100%);overflow:hidden}

.action strong{display:block;font-size:20px}.action span{display:block;font-size:14px;margin-top:5px;line-height:1.25}
