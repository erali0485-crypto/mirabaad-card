<style>
:root{--blue:#063a78;--blue2:#021d42;--gold:#e7a526;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#dcecf8;font-family:Arial,Helvetica,sans-serif;color:var(--blue)}body{min-width:320px}
.page{width:min(100%,1120px);margin:0 auto;background:#fff;box-shadow:0 18px 70px #062f6826;overflow:hidden}
.hero{position:relative;min-height:620px;padding:52px 52px 42px;background:linear-gradient(125deg,#fff 0%,#fff 58%,#eef8ff 100%);overflow:hidden}
.hero:before{content:"";position:absolute;width:760px;height:390px;left:-610px;top:-290px;border:50px solid var(--blue);border-radius:50%;box-shadow:0 0 0 8px var(--gold)}
.hero:after{content:"";position:absolute;width:900px;height:350px;right:-690px;bottom:-250px;border:50px solid var(--blue);border-radius:50%;box-shadow:0 0 0 8px var(--gold)}
.logo{position:absolute;right:45px;top:30px;width:205px;height:auto;z-index:5}
.identity{position:relative;z-index:5;width:46%;padding-top:105px}
.name{margin:0;font-size:64px;line-height:.93;letter-spacing:-3px;color:var(--blue);font-weight:800}
.role{display:flex;align-items:center;gap:14px;margin-top:32px;font-size:27px;font-weight:800}
.role i{display:block;width:80px;height:6px;background:var(--gold);border-radius:8px}
.location{display:flex;align-items:center;gap:13px;margin-top:32px;font-size:21px;font-weight:700}
.location-icon{width:48px;height:48px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:#fff;flex:0 0 48px}
.location-icon svg{width:25px;height:25px}
.building{position:absolute;z-index:4;right:38px;top:150px;width:53%;height:375px;border:2px solid var(--gold);border-radius:28px;overflow:hidden;background:#dcecf8;box-shadow:0 18px 42px #0a376b2d}
.building img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.contact{position:relative;background:linear-gradient(145deg,#083a75,#021d42);padding:42px 38px 40px}
.contact:before{content:"";position:absolute;inset:17px;border:1px solid #e7a526;border-radius:30px;pointer-events:none}
.heading{position:relative;z-index:2;margin:0 0 3px 42px;color:#ffd36a;font-size:36px;font-weight:800}
.subheading{position:relative;z-index:2;margin:0 0 26px 42px;color:#fff;font-size:19px}
.contact-grid{position:relative;z-index:2;display:grid;grid-template-columns:360px 1fr;gap:24px}
.qr-card{border:1px solid #e7a526;border-radius:28px;background:#031e40;padding:25px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.qr-frame{width:290px;height:290px;background:#fff;border-radius:20px;padding:14px;box-shadow:0 0 0 7px #e7a526}
.qr-frame img{width:100%;height:100%;display:block}
.qr-note{color:#fff;font-size:16px;text-align:center;margin-top:20px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.action{min-height:105px;border-radius:21px;padding:14px 17px;display:flex;align-items:center;gap:15px;text-decoration:none;border:1px solid #ffffff55;box-shadow:0 8px 22px #0004;transition:transform .15s ease}
.action:hover{transform:translateY(-2px)}
.icon{width:58px;height:58px;min-width:58px;border-radius:50%;display:grid;place-items:center;background:#fff}
.icon svg{width:34px;height:34px}
.action strong{display:block;font-size:20px}.action span{display:block;font-size:14px;margin-top:5px;line-height:1.25}
.phone{background:linear-gradient(135deg,#087cf5,#0755c5);color:#fff}.email{background:#fff;color:#073873}.telegram{background:#e8f7ff;color:#0967ad}.instagram{background:linear-gradient(135deg,#ffc66a,#ed3d8e 52%,#7140c3);color:#fff}.maps{background:#effff3;color:#176b3b}
@media(max-width:850px){
.hero{min-height:500px;padding:28px 22px}.logo{right:22px;top:20px;width:155px}.identity{width:50%;padding-top:76px}.name{font-size:42px;letter-spacing:-2px}.role{font-size:18px;margin-top:25px;gap:9px}.role i{width:48px;height:5px}.location{font-size:14px;margin-top:25px}.location-icon{width:38px;height:38px;flex-basis:38px}.building{right:14px;top:122px;width:49%;height:250px;border-radius:21px}.contact{padding:32px 20px}.heading{font-size:30px;margin-left:20px}.subheading{font-size:16px;margin-left:20px}.contact-grid{grid-template-columns:1fr}.qr-frame{width:min(76vw,300px);height:min(76vw,300px)}}
@media(max-width:560px){
.hero{min-height:430px;padding:20px 15px}.logo{right:14px;top:15px;width:125px}.identity{width:49%;padding-top:60px}.name{font-size:30px;letter-spacing:-1.2px}.role{font-size:14px;margin-top:20px;gap:7px}.role i{width:38px;height:4px}.location{font-size:11px;margin-top:20px;align-items:flex-start}.location-icon{width:32px;height:32px;flex-basis:32px}.location-icon svg{width:18px;height:18px}.building{right:9px;top:108px;width:48%;height:172px;border-radius:17px}.contact{padding:27px 12px 22px}.contact:before{inset:10px;border-radius:22px}.heading{font-size:24px;margin-left:18px}.subheading{font-size:14px;margin-left:18px;margin-bottom:20px}.contact-grid{gap:17px}.qr-card{padding:19px 11px;border-radius:20px}.qr-frame{width:min(78vw,300px);height:min(78vw,300px);padding:10px;box-shadow:0 0 0 5px #e7a526;border-radius:17px}.qr-note{font-size:12px;margin-top:14px}.actions{grid-template-columns:1fr;gap:10px}.action{min-height:74px;border-radius:17px;padding:9px 12px}.icon{width:48px;height:48px;min-width:48px}.icon svg{width:29px;height:29px}.action strong{font-size:16px}.action span{font-size:11px}}
</style>
