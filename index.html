<style>
:root{--blue:#073b78;--deep:#031d43;--gold:#e6a426;--gold2:#ffd36a}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#dcecf8;font-family:Arial,Helvetica,sans-serif;color:var(--blue)}
body{min-width:320px}
.page{width:min(100%,1120px);margin:auto;background:#fff;box-shadow:0 18px 70px #062f6826;overflow:hidden}
.hero{position:relative;width:100%;height:auto;min-height:0;padding:0!important;margin:0!important;background:#fff!important;overflow:hidden;aspect-ratio:735/435}
.hero-card{display:block;width:100%;height:100%;object-fit:cover;object-position:center}.hero-copy{display:none;position:absolute;inset:0;z-index:12;pointer-events:none}.hero-copy span{position:absolute;display:block;color:#08205f;background:rgba(255,255,255,.94);border-radius:4px;padding:1px 4px;box-shadow:0 0 8px rgba(255,255,255,.55)}.hero-copy .hc-name{left:9%;top:21%;width:51%;font-size:clamp(28px,6.2vw,54px);line-height:.98;font-weight:800;letter-spacing:-1.5px}.hero-copy .hc-role{left:9%;top:52%;width:50%;font-size:clamp(16px,3.2vw,27px);line-height:1.1;font-weight:800}.hero-copy .hc-location{left:15.5%;top:64%;width:50%;font-size:clamp(13px,2.6vw,21px);line-height:1.15;font-weight:600}.hero-copy .hc-prod{left:7%;top:85.5%;font-size:clamp(12px,2.3vw,19px);font-weight:700}.hero-copy .hc-partner{left:34%;top:85.5%;font-size:clamp(12px,2.3vw,19px);font-weight:700}body[data-lang="ru"] .hero-copy,body[data-lang="en"] .hero-copy{display:block}.lang-switch{position:absolute;left:5.8%;top:7.5%;z-index:20;display:flex;gap:4px;padding:4px;background:rgba(3,29,67,.88);border:1px solid #e6a426;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.22)}.lang-switch button{border:0;background:transparent;color:#fff;font-weight:800;font-size:12px;line-height:1;padding:7px 8px;border-radius:7px;cursor:pointer}.lang-switch button:first-child{background:#e6a426;color:#031d43}.lang-switch button:hover{background:rgba(255,255,255,.18)}

.brand{display:none;position:absolute;right:34px;top:24px;z-index:8;width:270px;height:82px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:0 0 0 18px}
.brand img{display:block;width:250px;height:74px;object-fit:contain;object-position:center}
.identity{display:none}
.name{margin:0;font-size:66px;line-height:.93;letter-spacing:-3px;color:var(--blue);font-weight:800}
.name-line{width:150px;height:7px;margin-top:18px;background:var(--gold);border-radius:9px}
.role{margin-top:17px;font-size:29px;font-weight:800}
.location{display:flex;align-items:center;gap:15px;margin-top:29px;font-size:22px;font-weight:700;white-space:nowrap}
.pin{width:45px;height:54px;flex:0 0 45px;display:block}
.services{display:flex;gap:54px;margin-top:42px;position:relative;z-index:6}
.service{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:800}
.service-icon{width:48px;height:48px;display:grid;place-items:center;color:var(--gold)}
.service-icon svg{width:44px;height:44px}
.building{position:absolute;z-index:4;right:38px;top:150px;width:49%;height:365px;border:2px solid var(--gold);border-radius:28px;overflow:hidden;background:#dcecf8;box-shadow:0 18px 42px #0a376b2d}
.building img{width:100%;height:100%;display:block;object-fit:contain;object-position:center;background:#fff}
.contact{position:relative;margin:0!important;background:linear-gradient(145deg,#083a75,#021d42);padding:38px 38px 34px}
.contact:before{content:"";position:absolute;inset:16px;border:1px solid #e7a526;border-radius:30px;pointer-events:none}
.heading{position:relative;z-index:2;margin:0 0 2px 42px;color:var(--gold2);font-size:36px;font-weight:800}
.subheading{position:relative;z-index:2;margin:0 0 24px 42px;color:#fff;font-size:19px}
.contact-grid{position:relative;z-index:2;display:grid;grid-template-columns:360px 1fr;gap:24px}
.qr-card{border:1px solid #e7a526;border-radius:28px;background:#031e40;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.qr-frame{width:290px;height:290px;background:#fff;border-radius:20px;padding:14px;box-shadow:0 0 0 7px #e7a526}
.qr-frame img{width:100%;height:100%;display:block}
.qr-note{color:#fff;font-size:16px;text-align:center;margin-top:18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.action{min-height:104px;border-radius:21px;padding:13px 16px;display:flex;align-items:center;gap:14px;text-decoration:none;border:1px solid #ffffff55;box-shadow:0 8px 22px #0004}
.icon{width:58px;height:58px;min-width:58px;border-radius:18px;display:grid;place-items:center;background:#fff;box-shadow:0 5px 14px #0002}
.icon svg{width:34px;height:34px;display:block}
.action strong{display:block;font-size:20px}
.action span{display:block;font-size:14px;margin-top:5px;line-height:1.25}
.phone{background:linear-gradient(135deg,#087cf5,#0755c5);color:#fff}
.email{background:#fff;color:#073873}
.telegram{background:#e8f7ff;color:#087bb8}
.instagram{background:linear-gradient(135deg,#fff0f6,#f1ddff);color:#8b2fa8}
.maps{background:#effff3;color:#176b3b}
@media(max-width:900px){

.identity{width:52%;padding-top:100px}.name{font-size:54px}.role{font-size:23px}.location{font-size:18px}.services{gap:28px}.service{font-size:17px}

.contact{padding:32px 20px}.contact-grid{grid-template-columns:1fr}.qr-frame{width:min(76vw,300px);height:min(76vw,300px)}
}
@media(max-width:650px){

.identity{width:100%;padding-top:34px}.name{font-size:41px;letter-spacing:-2px}.name-line{width:100px;height:5px;margin-top:14px}.role{font-size:19px;margin-top:13px}.location{font-size:14px;gap:9px;margin-top:19px;white-space:normal}.pin{width:32px;height:40px;flex-basis:32px}
.services{gap:25px;margin-top:25px}.service{font-size:14px;gap:7px}.service-icon,.service-icon svg{width:34px;height:34px}
.building{position:relative;right:auto;top:auto;width:100%;height:230px;margin-top:26px;border-radius:22px}
.contact{padding:27px 12px 22px}.contact:before{inset:10px;border-radius:22px}.heading{font-size:25px;margin-left:18px}.subheading{font-size:14px;margin-left:18px;margin-bottom:20px}
.contact-grid{gap:17px}.qr-card{padding:19px 11px;border-radius:20px}.qr-frame{width:min(78vw,300px);height:min(78vw,300px);padding:10px;box-shadow:0 0 0 5px #e7a526;border-radius:17px}.qr-note{font-size:12px;margin-top:14px}
.actions{grid-template-columns:1fr;gap:10px}.action{min-height:74px;border-radius:17px;padding:9px 12px}.icon{width:48px;height:48px;min-width:48px}.icon svg{width:29px;height:29px}.action strong{font-size:16px}.action span{font-size:11px}
.bottom-strip{grid-template-columns:1fr;gap:10px;min-height:0;padding:15px}.bottom-divider{width:80%;height:1px;margin:auto}.bottom-item{justify-content:flex-start}.bottom-item strong{font-size:16px}.bottom-item span{font-size:13px}
}
</style>

<script>
const LANGS={
uz:{img:"mirabaad-uz.webp",contactTitle:"BIZ BILAN ALOQA",contactSub:"QR kodni skaner qiling",qrNote:"QR-kod shu elektron vizitkani ochadi",call:"Qo‘ng‘iroq",email:"Email",telegram:"Telegram",instagram:"Instagram",maps:"Google Maps",openAddress:"Manzilni ochish"},
ru:{img:"mirabaad-uz.webp",contactTitle:"СВЯЖИТЕСЬ С НАМИ",contactSub:"Отсканируйте QR-код",qrNote:"QR-код открывает эту электронную визитку",call:"Позвонить",email:"Электронная почта",telegram:"Телеграм",instagram:"Инстаграм",maps:"Google Карты",openAddress:"Открыть адрес"},
en:{img:"mirabaad-uz.webp",contactTitle:"CONNECT WITH US",contactSub:"Scan the QR code",qrNote:"The QR code opens this electronic business card",call:"Call",email:"Email",telegram:"Telegram",instagram:"Instagram",maps:"Google Maps",openAddress:"Open address"}};
function setLang(lang){
 const d=LANGS[lang]||LANGS.uz;
 document.documentElement.lang=lang;
 document.body.dataset.lang=lang;
 document.getElementById("heroCard").src=d.img;
 const hc=document.getElementById("heroCopy");
 hc.querySelector(".hc-name").innerHTML=lang==="ru"?"Кхужаниязов<br>Нусратжон":lang==="en"?"Khujaniyazov<br>Nusratjon":"";
 hc.querySelector(".hc-role").textContent=lang==="ru"?"Учредитель и руководитель":lang==="en"?"Founder & Business Development":"";
 hc.querySelector(".hc-location").textContent=lang==="ru"?"Узбекистан, Ташкентская область":lang==="en"?"Uzbekistan, Tashkent Region":"";
 hc.querySelector(".hc-prod").textContent=lang==="ru"?"Производство":lang==="en"?"Dairy Production":"";
 hc.querySelector(".hc-partner").textContent=lang==="ru"?"Партнёрство":lang==="en"?"Partnership":"";
 document.querySelectorAll("[data-i18n]").forEach(el=>{if(d[el.dataset.i18n])el.textContent=d[el.dataset.i18n]});
 document.querySelectorAll(".lang-switch button").forEach(b=>{const active=b.dataset.lang===lang;b.style.background=active?"#e6a426":"transparent";b.style.color=active?"#031d43":"#fff"});
 localStorage.setItem("mirabaad-lang",lang);
}
document.querySelectorAll(".lang-switch button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
setLang(localStorage.getItem("mirabaad-lang")||"uz");
</script></body>
